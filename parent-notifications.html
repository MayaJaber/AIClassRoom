<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Parent Notifications</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <style> body{ background:#f1f5ff; font-family:'Segoe UI',sans-serif; padding:30px; } .box{ max-width:1000px; margin:auto; background:white; padding:30px; border-radius:20px; box-shadow:0 10px 30px #0002; } .title{ color:#0d6efd; font-weight:bold; } .notification-card{ border-radius:15px; padding:20px; margin-bottom:15px; border-left:7px solid; background:#f8f9fa; } .notification-card.present{ border-color:#198754; } .notification-card.late{ border-color:#ffc107; } .notification-card.absent{ border-color:#dc3545; } .student-name{ font-size:22px; font-weight:bold; } .notification-time{ color:#6c757d; } .empty{ text-align:center; color:#6c757d; padding:40px; } </style> </head> <body> <div class="box">
<div class="text-center mb-4">

    <h1 class="title">
        Parent Notifications
    </h1>

    <p class="text-muted">
        Attendance notifications for parents
    </p>

</div>


<div id="notifications">

    <div class="empty">
        No notifications yet.
    </div>

</div>


<div class="text-center mt-4">

    <button
        class="btn btn-danger"
        onclick="clearNotifications()"
    >
        Clear Notifications
    </button>

</div>

</div> <script> function loadNotifications(){ const notifications = JSON.parse( localStorage.getItem( "parentNotifications" ) || "[]" ); const container = document.getElementById( "notifications" ); container.innerHTML = ""; if(notifications.length === 0){ container.innerHTML = ` <div class="empty"> No notifications yet. </div> `; return; } notifications .slice() .reverse() .forEach(notification => { let className = notification.status .toLowerCase(); let icon = "🔔"; if(notification.status === "Present"){ icon = "🟢"; } if(notification.status === "Late"){ icon = "🟡"; } if(notification.status === "Absent"){ icon = "🔴"; } const card = document.createElement("div"); card.className = `notification-card ${className}`; card.innerHTML = ` <div class="student-name"> ${icon} ${notification.student} </div> <hr> <div> <strong>Status:</strong> ${notification.status} </div> <div> <strong>Arrival:</strong> ${notification.arrival || "-"} </div> <div> <strong>Class Time:</strong> ${notification.classTime || "-"} </div> <div class="notification-time mt-2"> Notification: ${notification.dateTime} </div> `; container.appendChild(card); }); } function clearNotifications(){ localStorage.removeItem( "parentNotifications" ); loadNotifications(); } loadNotifications(); // Check for new notifications // every second setInterval( loadNotifications, 1000 ); </script> </body> </html>
